# Týdenní kontrola aktualizací závislostí. Menší a patch verze se seskupí
# do jednoho PR na aplikaci, aby nevznikala desítka PR týdně.
version: 2
updates:
  - package-ecosystem: npm
    directory: /new-frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /admin-panel
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
